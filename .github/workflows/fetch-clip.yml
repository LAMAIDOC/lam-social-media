# Copies a finished Higgsfield clip into clips/ (social/higgsfield/make_media.py collect() pushes fetch/<key>.json).
# Runs on GitHub's machines, so big files and slow encodes never hit the Composio workbench's 180 second limit.
# fetch/<key>.json: {"url": "<Higgsfield result_url>", "talk": true|false}
name: Fetch clip
on:
  push:
    paths: ["fetch/*.json"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fetch-clip
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Get the repo
        run: git clone -q --depth 5 "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" . 
      - name: Download and shrink
        run: |
          set +e
          command -v ffmpeg >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null; }
          shopt -s nullglob
          for f in fetch/*.json; do
            key=$(basename "$f" .json)
            if ! [[ "$key" =~ ^[A-Za-z0-9_-]{1,120}$ ]]; then git rm -q "$f"; continue; fi
            url=$(jq -r .url "$f"); talk=$(jq -r '.talk // false' "$f")
            # Only Higgsfield's own file host.
            if ! [[ "$url" =~ ^https://d8j0ntlcm91z4\.cloudfront\.net/[A-Za-z0-9_./-]+\.mp4$ ]]; then echo "refused: not a Higgsfield file" > "fetch/$key.err"; git rm -q "$f"; git add "fetch/$key.err"; continue; fi
            code=$(curl -sSL --max-time 300 -o raw.mp4 -w "%{http_code}" "$url" 2> curl.err)
            if [ "$code" != "200" ]; then { echo "download failed: HTTP $code"; cat curl.err; } > "fetch/$key.err"; git add "fetch/$key.err"; continue; fi
            if [ "$talk" = "true" ]; then audio="-c:a aac -b:a 128k"; else audio="-an"; fi
            if ffmpeg -y -loglevel error -i raw.mp4 $audio -vf "scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,fps=30" \
                 -c:v libx264 -preset slow -crf 24 -pix_fmt yuv420p -movflags +faststart "clips/$key.mp4" 2> ff.err; then
              git rm -q "$f"; git rm -q --ignore-unmatch "fetch/$key.err"; git add "clips/$key.mp4"
            else
              { echo "ffmpeg failed:"; tail -5 ff.err; } > "fetch/$key.err"; git add "fetch/$key.err"
            fi
            rm -f raw.mp4
          done
      - name: Commit
        run: |
          git config user.name "LAM social"; git config user.email "ambassadors@littleangelmedical.com"
          git diff --cached --quiet || { git commit -qm "Fetched clips"; git pull -q --rebase; git push -q; }
          ls fetch/*.json >/dev/null 2>&1 && test -n "$(ls fetch/*.err 2>/dev/null)" && exit 1 || true
